          if (filters.grade !== 'all' && c.grade !== filters.grade) return false;
          if (filters.frequency === 'weekly' && c.orderCount < 10) return false;
          if (filters.frequency === 'monthly' && (c.orderCount < 4 || c.orderCount >= 10)) return false;
          if (filters.frequency === 'low' && c.orderCount >= 4) return false;
          if (c.totalSpent < filters.minSpent || c.totalSpent > filters.maxSpent) return false;
          if (filters.searchQuery.trim()) {
            const q = filters.searchQuery.toLowerCase();
            const m = c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.id.toLowerCase().includes(q);

          {/* Modals */}
          {selectedMenu && (
            <div style={{ position: 'fixed', inset: 0, zIndex: 2000, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }} onClick={() => setSelectedMenu(null)}>
              <div style={{ background: '#FFF', borderRadius: 'var(--radius-lg)', maxWidth: '540px', width: '100%', overflow: 'hidden' }} onClick={e => e.stopPropagation()}>
                <img src={selectedMenu.image} alt={selectedMenu.name} style={{ width: '100%', height: '240px', objectFit: 'cover' }} />
                <div style={{ padding: '2rem' }}>
                  <h3 style={{ fontSize: '1.6rem', fontWeight: 800 }}>{selectedMenu.name}</h3>
                  <p style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--flame-primary)', margin: '0.5rem 0 1rem' }}>₩{selectedMenu.price.toLocaleString()}</p>
                  <p style={{ color: 'var(--text-secondary)', lineHeight: 1.6, marginBottom: '1.5rem' }}>{selectedMenu.description}</p>
                  <button onClick={() => setSelectedMenu(null)} className="btn-primary" style={{ width: '100%', padding: '0.85rem' }}>닫기</button>
                </div>
              </div>
            </div>
          )}

          {authModalOpen && (
            <div style={{ position: 'fixed', inset: 0, zIndex: 2000, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }} onClick={() => setAuthModalOpen(false)}>
              <div style={{ background: '#FFF', borderRadius: 'var(--radius-lg)', maxWidth: '440px', width: '100%', padding: '2rem' }} onClick={e => e.stopPropagation()}>
                <h3 style={{ fontSize: '1.4rem', fontWeight: 800, textAlign: 'center', marginBottom: '1rem' }}>
                  {authMode === 'login' ? '금등어 회원 로그인' : '금등어 회원가입'}
                </h3>
                <form onSubmit={(e) => { e.preventDefault(); setUser({ name: '금등어 VIP 회원' }); setAuthModalOpen(false); }} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  <input type="email" required placeholder="이메일 주소" style={{ padding: '0.75rem', background: 'var(--bg-main)', border: '1px solid var(--border-light)', borderRadius: '4px' }} />
                  <input type="password" required placeholder="비밀번호" style={{ padding: '0.75rem', background: 'var(--bg-main)', border: '1px solid var(--border-light)', borderRadius: '4px' }} />
                  <button type="submit" className="btn-primary" style={{ padding: '0.85rem' }}>
                    {authMode === 'login' ? '로그인' : '회원가입 완료'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {activePopup && (
            <div style={{ position: 'fixed', inset: 0, zIndex: 1900, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }} onClick={() => setActivePopup(null)}>
              <div style={{ background: '#FFF', borderRadius: 'var(--radius-lg)', maxWidth: '420px', width: '100%', overflow: 'hidden' }} onClick={e => e.stopPropagation()}>
                <img src={activePopup.imageUrl} alt={activePopup.title} style={{ width: '100%', height: '180px', objectFit: 'cover' }} />
                <div style={{ padding: '1.5rem' }}>
                  <span className="badge-gold" style={{ marginBottom: '0.5rem' }}>{activePopup.badge}</span>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 800, margin: '0.5rem 0' }}>{activePopup.title}</h3>
                  <p style={{ fontSize: '0.875rem', color: 'var(--text-secondary)', lineHeight: 1.6, marginBottom: '1.25rem' }}>{activePopup.description}</p>
                  <button onClick={() => setActivePopup(null)} className="btn-primary" style={{ width: '100%', padding: '0.75rem' }}>{activePopup.linkText}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
